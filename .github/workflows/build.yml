name: Build Nanoid APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Do NOT use flutter-version-file here: it forwards pubspec's caret
      # constraint ("^3.47.0") verbatim and the action cannot resolve it.
      # Latest stable already satisfies the constraint.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: flutter pub get

      # Non-blocking: surfaces lint/analysis regressions without gating the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # Release signing material is optional. Without these secrets the release
      # APK is signed with the debug key (see android/app/build.gradle.kts) so
      # the job still yields an installable artifact.
      - name: Decode release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/key.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > android/key.properties

      - name: Build debug APK
        run: flutter build apk --debug --flavor github

      - name: Build release APK
        run: flutter build apk --release --flavor github

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nanoid-debug
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nanoid-release
          path: build/app/outputs/flutter-apk/app-github-release.apk
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-github-release.apk
          generate_release_notes: true
