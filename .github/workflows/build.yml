name: Build Nanoid APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get

      - run: flutter analyze .

      - name: Build debug APK
        run: flutter build apk --debug --flavor github

      - name: Build release APK
        run: flutter build apk --release --flavor github

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nanoid-debug
          path: build/app/outputs/flutter-apk/app-github-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nanoid-release
          path: build/app/outputs/flutter-apk/app-github-release.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-github-debug.apk
            build/app/outputs/flutter-apk/app-github-release.apk
          generate_release_notes: true
