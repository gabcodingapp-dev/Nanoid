name: Test, Build and Release F-Droid APK

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Update:')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Prepare release signing when configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          LEGACY_KEYSTORE_B64: ${{ secrets.KEYSTORE2 }}
          LEGACY_KEY_PASSWORD: ${{ secrets.KEY_STORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/key.jks
            key_password="$KEY_PASSWORD"
            store_password="$STORE_PASSWORD"
          elif [ -n "$LEGACY_KEYSTORE_B64" ]; then
            printf '%s' "$LEGACY_KEYSTORE_B64" | base64 --decode > android/key.jks
            key_password="$LEGACY_KEY_PASSWORD"
            store_password="$KEY_PASSWORD"
          else
            echo 'No release keystore configured; Gradle will use the debug key.'
            exit 0
          fi
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$key_password"
            echo "storePassword=$store_password"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub

      - name: Build F-Droid APK
        run: flutter build apk --release --flavor fdroid -t lib/main_fdroid.dart --no-pub

      - name: Release F-Droid APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-fdroid-release.apk
          asset_name: Nanoid-fdroid.apk
          tag: v${{ steps.version.outputs.version }}
          prerelease: false
          overwrite: true
