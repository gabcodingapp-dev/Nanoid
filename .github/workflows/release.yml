name: Test, Build and Release APK

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    if: contains(github.event.head_commit.message, 'Update:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Supports both the current secret names and the repository's older names.
      # The Gradle project expects these files directly under android/, not android/app/.
      - name: Prepare release signing when configured
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          LEGACY_KEYSTORE_B64: ${{ secrets.KEYSTORE2 }}
          LEGACY_KEY_PASSWORD: ${{ secrets.KEY_STORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > android/key.jks
            key_password="$KEY_PASSWORD"
            store_password="$STORE_PASSWORD"
          elif [ -n "$LEGACY_KEYSTORE_B64" ]; then
            printf '%s' "$LEGACY_KEYSTORE_B64" | base64 --decode > android/key.jks
            key_password="$LEGACY_KEY_PASSWORD"
            store_password="$KEY_PASSWORD"
          else
            echo 'No release keystore configured; Gradle will use the debug key.'
            exit 0
          fi
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$key_password"
            echo "storePassword=$store_password"
          } > android/key.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Build arm64 APK
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64 --flavor github --no-pub

      - name: Release arm64 APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
          asset_name: Nanoid-arm64-v8a.apk
          tag: v${{ steps.version.outputs.version }}
          prerelease: false
          overwrite: true

      - name: Build universal APK
        run: flutter build apk --release --flavor github --no-pub

      - name: Release universal APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-github-release.apk
          asset_name: Nanoid.apk
          tag: v${{ steps.version.outputs.version }}
          prerelease: false
          overwrite: true
